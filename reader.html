<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ukážka z komiksu | Lomidrevo Junior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="reader" id="reader">
  <div class="topbar">
    <a class="iconbtn" href="index.html" title="Všetky ukážky" aria-label="Všetky ukážky">☰</a>
    <div class="t"><b id="ttl"></b> <span id="sub"></span></div>
    <a class="btn" id="buy" target="_top" href="#"></a>
    <button class="iconbtn" id="fs" title="Celá obrazovka" aria-label="Celá obrazovka">⛶</button>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="Predchádzajúca strana">‹</button>
    <div class="book" id="book"></div>
    <button class="nav next" id="next" aria-label="Ďalšia strana">›</button>
    <div class="end" id="end">
      <h2>Chcete čítať ďalej?</h2>
      <p>Toto bola len ukážka. Celý príbeh nájdete v knihe.</p>
      <div class="row">
        <a class="btn" id="buy2" target="_top" href="#"></a>
        <button class="btn alt" id="again">Čítať od začiatku</button>
      </div>
    </div>
  </div>
  <div class="footer" id="pos" aria-live="polite"></div>
</div>
<script src="common.js"></script>
<script>
(async () => {
  const books = await loadBooks();
  const id = new URLSearchParams(location.search).get("b");
  const bk = books.find(b => b.id === id) || books[0];
  const pages = parsePages(bk.pages, bk.total);
  const n = pages.length;
  const src = i => `${bk.folder}/${pad(pages[i])}.webp`;
  document.title = `${bk.title}, ${bk.subtitle} | Ukážka`;
  ttl.textContent = bk.title; sub.textContent = bk.subtitle;
  for (const a of [buy, buy2]) { a.href = bk.buyUrl; a.textContent = bk.buyLabel; }

  const mq = matchMedia("(max-width:760px), (max-aspect-ratio:1/1)");
  let single = mq.matches, pos = 0, busy = false;
  // spread index k: left = 2k-1, right = 2k (page 0 stands alone on the right, like a real book)
  const lastPos = () => single ? n - 1 : Math.floor(n / 2);
  const L = k => (2 * k - 1 >= 0 && 2 * k - 1 < n) ? 2 * k - 1 : null;
  const R = k => (2 * k < n) ? 2 * k : null;
  const slot = (cls, i) => `<div class="slot ${cls}${i == null ? " empty" : ""}">${i == null ? "" : `<img src="${src(i)}" alt="Strana ${pages[i]}" draggable="false">`}</div>`;

  function label() {
    if (single) return `Strana ${pos + 1} z ${n}`;
    const a = L(pos), b = R(pos);
    if (a == null) return `Strana 1 z ${n}`;
    return b == null ? `Strana ${a + 1} z ${n}` : `Strany ${a + 1}–${b + 1} z ${n}`;
  }
  function render() {
    book.classList.toggle("spread", !single);
    book.innerHTML = single ? slot("r", pos) : slot("l", L(pos)) + slot("r", R(pos));
    pos_.textContent = label(); // footer
    prev.disabled = pos === 0;
    next.disabled = false;
    [pos - 1, pos + 1, pos + 2].forEach(p => preload(p));
  }
  const pos_ = document.getElementById("pos");
  const preload = p => {
    const idx = single ? [p] : [L(p), R(p)];
    idx.forEach(i => { if (i != null && i >= 0 && i < n) new Image().src = src(i); });
  };

  function go(dir) {
    if (busy) return;
    if (dir > 0 && pos >= lastPos()) { end.classList.add("show"); return; }
    if (dir < 0 && pos === 0) return;
    const t = pos + dir;
    const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
    if (reduce) { pos = t; return render(); }
    busy = true;
    if (single) { // quick slide
      const s = book.firstElementChild;
      s.animate([{ transform: "none", opacity: 1 }, { transform: `translateX(${-dir * 40}px)`, opacity: 0 }], { duration: 160, easing: "ease-in" })
        .onfinish = () => { pos = t; render(); book.firstElementChild.animate([{ transform: `translateX(${dir * 40}px)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 160, easing: "ease-out" }); busy = false; };
      return;
    }
    // 3D page turn
    const slots = book.children;
    const w = slots[1].getBoundingClientRect();
    const leaf = document.createElement("div"); leaf.className = "leaf";
    const front = dir > 0 ? R(pos) : L(pos), back = dir > 0 ? L(t) : R(t);
    leaf.innerHTML = `<div class="f">${front == null ? "" : `<img src="${src(front)}">`}</div><div class="b">${back == null ? "" : `<img src="${src(back)}">`}</div>`;
    const bookBox = book.getBoundingClientRect();
    leaf.style.left = (dir > 0 ? w.left - bookBox.left : slots[0].getBoundingClientRect().left - bookBox.left) + "px";
    leaf.style.width = w.width + "px";
    leaf.style.transformOrigin = dir > 0 ? "left center" : "right center";
    // reveal the page beneath
    if (dir > 0) slots[1].outerHTML = slot("r", R(t)); else slots[0].outerHTML = slot("l", L(t));
    book.appendChild(leaf);
    leaf.animate([{ transform: "rotateY(0)" }, { transform: `rotateY(${dir > 0 ? -180 : 180}deg)` }], { duration: 520, easing: "ease-in-out" })
      .onfinish = () => { leaf.remove(); pos = t; render(); busy = false; };
  }

  prev.onclick = () => go(-1); next.onclick = () => go(1);
  again.onclick = () => { end.classList.remove("show"); pos = 0; render(); };
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "Escape") end.classList.remove("show");
  });
  let sx = null;
  stage.addEventListener("pointerdown", e => { sx = e.clientX; });
  stage.addEventListener("pointerup", e => {
    if (sx == null) return; const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    else if (e.target.closest(".slot")) { const r = book.getBoundingClientRect(); go(e.clientX > r.left + r.width / 2 ? 1 : -1); }
  });
  mq.onchange = () => { // keep the same page when switching layouts
    const cur = single ? pos : (L(pos) != null ? L(pos) : 0);
    single = mq.matches; pos = single ? cur : Math.ceil(cur / 2); render();
  };
  fs.onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else window.open(location.href, "_blank");
  };
  render();
})();
</script>
</body>
</html>
